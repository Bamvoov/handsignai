<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>MUDRA AI - Sign Language Translation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #111827; }
        .glass-panel { background: white; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 1rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="w-full py-6 px-8 border-b border-gray-200 bg-white flex items-center justify-between">
        <h1 class="text-2xl font-semibold tracking-tight text-gray-900">MUDRA AI</h1>
        <div class="text-sm text-gray-500 font-medium">Real-time Sign Language to Text</div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 flex flex-col md:flex-row gap-8 max-w-7xl mx-auto w-full">
        
        <!-- Left Column: Camera Module -->
        <section class="flex-1 flex flex-col gap-4">
            <h2 class="text-lg font-medium text-gray-800">Camera Feed</h2>
            <div class="glass-panel p-2 relative flex-grow min-h-[400px] flex items-center justify-center overflow-hidden bg-gray-100">
                <!-- Video feed from backend -->
                <img id="video-feed" class="w-full h-full object-contain rounded-lg" alt="Waiting for camera..." />
                
                <!-- Hidden elements for local capture -->
                <video id="webcam" autoplay playsinline class="hidden"></video>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <!-- Controls & Output -->
            <div class="glass-panel p-6 flex flex-col gap-4 mt-2">
                <label for="translatedText" class="text-sm font-medium text-gray-700">Translation Output</label>
                <input type="text" id="translatedText" readonly class="w-full text-lg p-4 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-300 transition-all" placeholder="Translation will appear here..." />
                
                <div class="flex gap-3 mt-2">
                    <button id="speakButton" class="flex-1 bg-black hover:bg-gray-800 text-white font-medium py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                          <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
                        </svg>
                        Speak
                    </button>
                    <button id="resetButton" class="flex-1 bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-medium py-3 px-4 rounded-lg transition-colors">
                        Clear
                    </button>
                </div>
            </div>
        </section>

        <!-- Right Column: Reference Images -->
        <section class="flex-1 flex flex-col gap-4">
            <h2 class="text-lg font-medium text-gray-800">Reference Guide</h2>
            <div class="glass-panel p-6 h-full flex flex-col gap-6 overflow-y-auto max-h-[800px]">
                <div class="space-y-2">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">American Sign Language</h3>
                    <img src="https://raw.githubusercontent.com/uzibytes/Sign2Text/master/hand-signs-of-the-ASL-Language.png" alt="ASL Reference" class="w-full rounded border border-gray-200">
                </div>
                <div class="space-y-2">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Custom Signs</h3>
                    <img src="https://i.ibb.co/ZJ7858c/customsl.jpg" alt="Custom Reference" class="w-full rounded border border-gray-200">
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-sm text-gray-400">
        &copy; 2024 MUDRA AI
    </footer>

    <script>
        const socket = io();

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const videoFeed = document.getElementById('video-feed');
        const translatedText = document.getElementById('translatedText');

        // Start webcam
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(function(stream) {
                video.srcObject = stream;
            }).catch(function(err) {
                console.error("Error accessing webcam: ", err);
                alert("Could not access your webcam. Please allow camera permissions.");
            });
        } else {
            alert("Your browser does not support webcam access.");
        }

        // When video starts playing, send frames to backend
        video.addEventListener('play', function() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            setInterval(() => {
                if (video.paused || video.ended) return;
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                // Convert to base64 jpeg
                const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
                socket.emit('image', dataUrl);
            }, 150); // ~6-7 FPS
        });

        // Receive processed image from backend
        socket.on('processed_image', function(dataUrl) {
            videoFeed.src = dataUrl;
        });

        // Update prediction
        socket.on('prediction', function (data) {
            translatedText.value = data.text;
        });

        // Controls
        document.getElementById('resetButton').addEventListener('click', function () {
            translatedText.value = '';
        });

        document.getElementById('speakButton').addEventListener('click', function() {
            const text = translatedText.value;
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = speechSynthesis.getVoices();
            // Fallback to default if UK female is not found
            utterance.voice = voices.find(voice => voice.name.includes('Female')) || voices[0]; 
            utterance.rate = 1.0; 
            speechSynthesis.speak(utterance);
        });
    </script>
</body>
</html>
